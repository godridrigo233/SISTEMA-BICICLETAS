# ──────────────────────────────────────────────────────────────────────
# OWASP ZAP – Baseline Scan (pasivo, sin autenticación)
# Workflow manual para ejecutar contra la SPA y la API desplegadas.
# ──────────────────────────────────────────────────────────────────────

name: "Seguridad – OWASP ZAP Baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────── SPA ──────────────────────────
  zap-spa:
    name: "ZAP Baseline – SPA"
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener código
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Escaneo ZAP Baseline – SPA
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.ZAP_URL_SPA || secrets.ZAP_URL_SPA || 'https://sistema-bicicletas.vercel.app' }}
          rules_file_name: ".zap/reglas.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-reporte-spa"

      - name: Subir reportes SPA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reportes-spa
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

  # ────────────────────────── API ──────────────────────────
  zap-api:
    name: "ZAP Baseline – API"
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener código
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Escaneo ZAP Baseline – API
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.ZAP_URL_API || secrets.ZAP_URL_API || 'https://sistema-bicicletas.onrender.com' }}
          rules_file_name: ".zap/reglas.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-reporte-api"

      - name: Subir reportes API
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reportes-api
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

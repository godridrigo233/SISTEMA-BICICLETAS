# ──────────────────────────────────────────────────────────────────────
# OWASP ZAP – Baseline Scan (pasivo, sin autenticación)
# Workflow manual para ejecutar contra la SPA y la API desplegadas.
# ──────────────────────────────────────────────────────────────────────

name: "Seguridad – OWASP ZAP Baseline"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────── SPA ──────────────────────────
  zap-spa:
    name: "ZAP Baseline – SPA"
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Escaneo ZAP Baseline – SPA
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.ZAP_URL_SPA }}
          rules_file_name: ".zap/reglas.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-reporte-spa"

      - name: Subir reportes SPA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-reportes-spa
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

  # ────────────────────────── API ──────────────────────────
  zap-api:
    name: "ZAP Baseline – API"
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Escaneo ZAP Baseline – API
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.ZAP_URL_API }}
          rules_file_name: ".zap/reglas.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-reporte-api"

      - name: Subir reportes API
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-reportes-api
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

# Prueba de Carga para RNF-01 (tiempo de respuesta < 2 s) con k6.
# Flujo manual activable mediante workflow_dispatch.
# Las credenciales se gestionan a través de secretos y variables de entorno, nunca en el código.
name: Prueba de Carga RNF-01 (k6)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base de la API REST, completa con https:// (déjelo vacío para usar el secreto K6_BASE_URL)'
        required: false
        type: string
        default: ''
      perfil:
        description: 'garita = consulta por QR del vigilante (RNF-01); estudiante = sesiones de estudiante (navegación e inicios de sesión) con una sonda de garita para medir su efecto en el RNF-01. Ambos son de solo lectura.'
        required: false
        type: choice
        options:
          - garita
          - estudiante
        default: garita
      modo:
        description: 'carga = 10 VUs durante 2 min (RNF-01); escalonada = sube los VUs por niveles para hallar la capacidad máxima (siempre de solo lectura, ~16 min).'
        required: false
        type: choice
        options:
          - carga
          - escalonada
        default: carga
      niveles:
        description: 'Solo modo escalonada: niveles de VUs separados por comas (vacío = 10,25,50,100,150 en garita y 10,25,50 sesiones en estudiante).'
        required: false
        type: string
        default: ''
      permitir_escritura:
        description: 'Permitir operaciones de escritura (true/false). PRECAUCIÓN: true solo debe usarse contra base de datos de prueba, nunca contra el piloto.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: carga-k6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carga:
    name: Prueba de Carga RNF-01 (${{ inputs.perfil || 'garita' }} - ${{ inputs.modo == 'escalonada' && 'escalonada' || '10 VUs - 2m' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v5

      - name: Configurar k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Ejecutar prueba de carga con k6
        env:
          K6_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.K6_BASE_URL || vars.K6_BASE_URL }}
          K6_CORREO: ${{ secrets.K6_CORREO || vars.K6_CORREO }}
          K6_PASSWORD: ${{ secrets.K6_PASSWORD }}
          K6_CODIGO_QR: ${{ secrets.K6_CODIGO_QR || vars.K6_CODIGO_QR }}
          K6_PERMITIR_ESCRITURA: ${{ inputs.permitir_escritura }}
          K6_MODO: ${{ inputs.modo || 'carga' }}
          K6_NIVELES: ${{ inputs.niveles }}
          K6_CORREO_ESTUDIANTE: ${{ secrets.K6_CORREO_ESTUDIANTE }}
          K6_PASSWORD_ESTUDIANTE: ${{ secrets.K6_PASSWORD_ESTUDIANTE }}
          SCRIPT_K6: ${{ inputs.perfil == 'estudiante' && 'tests/carga/estudiante-carga.js' || 'tests/carga/rnf01-carga.js' }}
        run: |
          mkdir -p tests/carga/resultados
          k6 run "$SCRIPT_K6"

      - name: Publicar resumen de prueba de carga
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resumen-prueba-carga-rnf01
          path: tests/carga/resultados/
          retention-days: 14

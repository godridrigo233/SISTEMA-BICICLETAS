name: Respaldo Diario de Supabase

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17

      - name: Generar marca de tiempo
        id: date
        run: echo "FECHA=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Extraer base de datos (pg_dump)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" > respaldo_ucsm_${{ env.FECHA }}.sql

      - name: Guardar respaldo como Artefacto en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.FECHA }}
          path: respaldo_ucsm_${{ env.FECHA }}.sql
          retention-days: 30
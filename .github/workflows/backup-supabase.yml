name: Respaldo Diario de Supabase

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC = 22:00 hora de Lima
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Generar marca de tiempo
        run: echo "FECHA=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Extraer base de datos (pg_dump)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges \
            --file="respaldo_ucsm_${FECHA}.sql"
          echo "Tamaño del respaldo:"; ls -lh "respaldo_ucsm_${FECHA}.sql"
          grep -q "CREATE TABLE" "respaldo_ucsm_${FECHA}.sql" || { echo "El respaldo no contiene tablas"; exit 1; }

      - name: Guardar respaldo como Artefacto en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.FECHA }}
          path: respaldo_ucsm_${{ env.FECHA }}.sql
          retention-days: 30
          if-no-files-found: error
# Proyecto SonarCloud de la SPA (monorepo: un proyecto por componente).
# La organización y la clave del proyecto se pasan desde el pipeline con la variable de
# repositorio SONAR_ORGANIZATION (Settings → Secrets and variables → Actions → Variables).
sonar.projectName=Sistema Bicicletas UCSM - SPA React
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,public/models/**,dist/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
